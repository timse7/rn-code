# Tool configuration only — the examples are standalone scripts, not a package.

[tool.ruff]
target-version = "py39"
line-length = 90

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # import sorting
  "UP",  # pyupgrade
  "B",   # bugbear
]

[tool.ruff.format]
quote-style = "double"
